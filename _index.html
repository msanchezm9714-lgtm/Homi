const DB = window.HOMI_DB;
if (!DB) { console.error("Falta HOMI_DB (catalogo.js)"); return; }
const IMG = (p, n) => window.homiPack ? homiPack(p.img + "/" + n) : `img/${p.img}/${n}.jpg`;
window.HOMI_FX = DB.fx.MXN_por_USD;
window.HOMI_BROKERS = DB.brokers;
window.HOMI_PROYECTOS = DB.proyectos;
window.HOMIE_DEPAS = DB.depas.map(d => {
const p = DB.proyectos[d.proyecto], b = DB.brokers[d.broker] || {nombre: d.broker};
const G = g => ({src: IMG(p, g.src), cat: g.cat, es: g.es, en: g.en});
return {
id: d.id, nombre: d.nombre, modelo: d.modelo, zona: p.nombre, proyecto: d.proyecto, proyectoNombre: p.nombre,
broker: d.broker, brokerNombre: b.nombre,
precio: d.precio, moneda: d.moneda, rec: d.rec, banos: d.banos, est: d.est, m2: d.m2,
mapa: p.mapa, ubicacion: p.ubicacion.es, unidades: d.unidades,
entrega: d.es.entrega, corta: d.es.corta, tipo: d.es.tipo, resumen: d.es.resumen, descripcion: d.es.descripcion, pago: d.es.pago,
amenidades: p.amenidades.es,
_i18n: {es: d.es, en: Object.assign({}, d.en, {ubicacion: p.ubicacion.en, amenidades: p.amenidades.en})},
dev: p.desarrollador,
galeria: [...d.galeria, ...p.galeria].map(G).sort((a, z) => ["depa","comun","planos"].indexOf(a.cat) - ["depa","comun","planos"].indexOf(z.cat)),
fotos: d.fotos.map(n => IMG(p, n)),
fotosProyecto: p.fotosProyecto.map(n => IMG(p, n)),
areas: p.areas.map(a => ({src: IMG(p, a.src), es: a.es, en: a.en}))
};
});
window.homiDepa = id => HOMIE_DEPAS.find(x => x.id === id) || null;
window.homieFmt = n => "$" + Math.round(n).toLocaleString("en-US");
window.homiMoney = (n, cur) => `${homieFmt(n)} ${cur}`;

window.homieFavs = {
get(){ try{ return JSON.parse(localStorage.getItem("homie:favs")||"[]").filter(id => homiDepa(id)) }catch(e){ return [] } },
has(id){ return this.get().includes(id) },
add(id){ const f=this.get(); if(!f.includes(id)){ f.push(id); try{localStorage.setItem("homie:favs",JSON.stringify(f))}catch(e){} } },
remove(id){ try{localStorage.setItem("homie:favs",JSON.stringify(this.get().filter(x=>x!==id)))}catch(e){} },
toggle(id){ this.has(id)?this.remove(id):this.add(id); return this.has(id) }
};
const urlLang = new URLSearchParams(location.search).get("lang");
window.homiLang = {
get(){
if (urlLang === "en" || urlLang === "es") return this._l || urlLang;
if (this._l) return this._l;
try{ const s = localStorage.getItem("homi:lang"); if (s === "en" || s === "es") return s; }catch(e){}
return /^en\b/i.test(navigator.language || "") ? "en" : "es";   // primera visita: idioma del navegador
},
set(l){
this._l = l;
try{ localStorage.setItem("homi:lang",l) }catch(e){}
document.documentElement.lang = l;
const u = new URL(location.href);
if (l === "en") u.searchParams.set("lang","en"); else u.searchParams.delete("lang");
history.replaceState(history.state, "", u);
}
};

const live = () => cv.isConnected && vis && !document.hidden && gate();

<script>

        <div class="price"><small>${T("from")}</small><b class="num">${homieFmt(d.precio)}</b> <em>${d.moneda}</em></div>
      </div>
      <div class="facts">
        <div>${I("bed")}<small>${T("bedrooms")}</small><b>${d.rec}</b></div>
        <div>${I("bathtub")}<small>${T("baths")}</small><b>${d.banos}</b></div>

$("#match").addEventListener("click", e=>{ if(e.target.id==="match") closeMatch(); });
/* ---------- Favoritos ---------- */
function bumpFab(){ const f=$("#openFavs"); f.classList.remove("bump"); void f.offsetWidth; f.classList.add("bump"); }
function refreshFavs(){
  const ids = homieFavs.get(), list = $("#favList");
  $("#favCount").textContent = ids.length; $("#sumSaved").textContent = ids.length;
  if(!ids.length){ list.innerHTML = `<p class="none">${I("heart")}${t("favsNone")}</p>`; return; }
  list.innerHTML = ids.map(id=>HOMIE_DEPAS.find(x=>x.id===id)).filter(Boolean).map(homiL).map((d,k)=>`
    <a class="fav" href="${homiHref("depa", {id: d.id})}" style="--k:${k}"><img src="${d.fotos[0]}" alt=""><div><h3>${d.nombre}</h3><small>${d.zona}</small><div class="p num">${homiMoney(d.precio, d.moneda)}</div></div>${I("caret-right")}</a>`).join("");
}
const drawer = (open)=>{ if(open) refreshFavs(); $("#drawer").classList.toggle("show",open); $("#scrim").classList.toggle("show",open); };
$("#openFavs").onclick = ()=>drawer(true); $("#seeFavs").onclick = ()=>drawer(true);
$("#closeFavs").onclick = $("#scrim").onclick = ()=>drawer(false);
$("#restart").onclick = ()=>{ queue=[...HOMIE_DEPAS]; render(true); };
/* ---------- Botones y teclado ---------- */
$("#btnNo").onclick = ()=>decide("nope");
$("#btnYes").onclick = ()=>decide("like");
$("#btnInfo").onclick = ()=>{ if(!current) return; press($("#btnInfo"));
  const el = current.el; goDetail(el.querySelectorAll(".photo img")[el._idx], current.d.id, el._idx); };
addEventListener("keydown", e=>{
  if($("#match").classList.contains("show")){ if(e.key==="Escape") closeMatch(); return; }
  if(e.key==="Escape") drawer(false);
  if(e.key==="ArrowRight") decide("like");
  if(e.key==="ArrowLeft") decide("nope");
});
/* Al volver con "atrás", quitar el nombre de transición para que no se duplique */
addEventListener("pageshow", ()=>document.querySelectorAll("[style*='view-transition-name']").forEach(el=>el.style.viewTransitionName=""));
/* ---------- Idioma ---------- */
function applyLang(){
  const l = homiLang.get();
  document.querySelectorAll("[data-i18n]").forEach(e=>e.textContent = t(e.dataset.i18n));
  document.querySelectorAll("[data-i18n-aria]").forEach(e=>e.setAttribute("aria-label", t(e.dataset.i18nAria)));
  document.title = l==="en" ? "Homi | Apartments for sale in Playa del Carmen" : "Homi | Departamentos en venta en Playa del Carmen";
  document.querySelectorAll("[data-privacy]").forEach(a=>a.href=homiHref("aviso-privacidad"));
  document.querySelectorAll("[data-home]").forEach(a=>a.href=homiHref("index"));
  $("#availChip").textContent = t("availChip")(HOMIE_DEPAS.length);
  const min = HOMIE_DEPAS.reduce((a,b)=>a.precio<b.precio?a:b);
  $("#sumFrom").innerHTML = `${homieFmt(min.precio)} <em>${min.moneda}</em>`;
  $("#sumZone").textContent = homiL(min).zona;
  $("#sumAvail").textContent = HOMIE_DEPAS.length;
  if(matched){ paintMatch(); paintMatchSave(); }
  render(true); refreshFavs();
}
homiLangUI(applyLang);
applyLang();
/* ---------- Entrada ---------- */
const splash = $("#splash"), app = document.querySelector(".app");
const skip = (()=>{ try{ return sessionStorage.getItem("homi:in")==="1"; }catch(e){ return false; } })();
if(skip){ splash.remove(); }
else {
  HomiFX.sphere($("#sphere"), {n:1300, r:.4, pulse:true, mouse:true, alpha:.9, gate:()=>splash.isConnected && !splash.classList.contains("out")});
  const enter = ()=>{ if(splash.classList.contains("out")) return; splash.classList.add("out"); app.classList.add("enter");
    try{ sessionStorage.setItem("homi:in","1"); }catch(e){}
    setTimeout(()=>splash.remove(),1000); };
  splash.addEventListener("click", enter);
  addEventListener("keydown", e=>{ if(splash.isConnected && !splash.classList.contains("out") && (e.key==="Enter"||e.key===" "||e.key.startsWith("Arrow"))){ e.preventDefault(); e.stopImmediatePropagation(); enter(); } }, true);
}
</script>
</body>
</html>
