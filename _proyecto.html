<script>(() => {
const C = window.HOMI_CFG = Object.assign({
site: location.origin, wa: "", pixel: "", plausible: "", clean: false, sw: false, lang: "es"
}, window.HOMI_CFG || {});
window.homiHref = (page, params) => {
const base = page === "index" ? (C.clean ? "/" : "index.html") : (C.clean ? "/" + page : page + ".html");
const q = new URLSearchParams(params || {});
if (homiLang.get() === "en") q.set("lang", "en");
const s = q.toString();
return base + (s ? "?" + s : "");
};
const KEY = "homi:attr";
const read = () => { try { return JSON.parse(sessionStorage.getItem(KEY) || "{}"); } catch (e) { return {}; } };
const qs = new URLSearchParams(location.search), attr = read();
["broker", "ref"].forEach(k => { const v = (qs.get(k) || "").trim().slice(0, 60); if (v) attr[k] = v; });
if (!attr.landing) attr.landing = location.pathname + location.search;
try { sessionStorage.setItem(KEY, JSON.stringify(attr)); } catch (e) {}
window.homiAttr = () => ({ broker: attr.broker || "", ref: attr.ref || "", landing: attr.landing || "" });
const FB = { ver_depa: "ViewContent", favorito: "AddToWishlist", click_whatsapp: "Contact", lead_enviado: "Lead" };
window.homiTrack = (name, props = {}) => {
const a = homiAttr();
const p = Object.assign({ lang: homiLang.get(), broker: a.broker || "(none)", ref: a.ref || "(none)" }, props);
try { window.plausible && plausible(name, { props: p }); } catch (e) {}
try {
if (window.fbq) {
const opt = p.folio ? { eventID: p.folio } : undefined;
if (FB[name]) fbq("track", FB[name], Object.assign({ content_ids: p.depa ? [p.depa] : undefined, content_type: "product" }, p), opt);
else fbq("trackCustom", name, p);
}
} catch (e) {}
};
window.homiLangUI = (onChange) => {

const paint = () => { const l = homiLang.get(); g.dataset.on = l;
g.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.l === l))); };
g.querySelectorAll("button").forEach(b => b.onclick = () => {
if (b.dataset.l === homiLang.get()) return;
homiLang.set(b.dataset.l); homiTrack("cambio_idioma", { a: b.dataset.l });
document.querySelectorAll("[data-lang-switch]").forEach(x => x._paint && x._paint());
onChange && onChange();
});
g._paint = paint; paint();
});
};

      <h2>${t("pjCtaTitle")(d.nombre)}</h2>
      <p>${t("pjCtaSub")}</p>
      <div class="row">
        <button class="btn dark" type="button" data-lead>${I("chat-circle-text")}${t("leadCta")}</button>
        <a class="btn line-dark" href="${homiHref("depa", {id: d.id})}">${t("pjBack")}</a>
      </div>
    </div>
    <p class="note">${t("note")}</p>
  </section>
  <footer class="foot"><span>© 2026 ${t("rights")}</span><a href="${homiHref("aviso-privacidad")}">${t("privacy")}</a></footer>
  <!-- ÁREAS: vista ampliada con giro -->
  <div class="cflb" id="cfLb" aria-hidden="true">
    <button class="chip lb-x" id="cfX" aria-label="${t("galClose")}">${I("x")}</button>
    <div class="cflb-in">
      <figure class="cflb-fig" id="cfFig"><img id="cfLbImg" alt=""></figure>
      <div class="cflb-cap" id="cfCap"><span class="num" id="cfLbN"></span><h3 id="cfLbName"></h3><p id="cfLbDesc"></p></div>
    </div>
    <button class="arrow l" id="cfLbP" aria-label="${t("prev")}">${I("caret-left")}</button><button class="arrow r" id="cfLbNx" aria-label="${t("next")}">${I("caret-right")}</button>
  </div>
  <!-- LIGHTBOX -->
  <div class="lb" id="lb" aria-hidden="true">
    <button class="chip lb-x" id="lbX" aria-label="${t("galClose")}">${I("x")}</button>
    <button class="arrow l" id="lbP" aria-label="${t("prev")}">${I("caret-left")}</button>
    <span class="chip lb-count num" id="lbCount"></span>
    <figure><img id="lbImg" alt=""><figcaption id="lbCap"></figcaption></figure>
    <button class="arrow r" id="lbN" aria-label="${t("next")}">${I("caret-right")}</button>
  </div>`;
  document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{
    document.querySelectorAll(".tabs button").forEach(x=>{ x.classList.toggle("on",x===b); x.setAttribute("aria-selected", x===b); });
    const wt=$("#whoText"), wi=$("#whoImg"); wt.classList.add("swap"); wi.classList.add("swap");
    setTimeout(()=>{ wt.textContent = tabsTxt[+b.dataset.i]; wi.src = pick(3+ +b.dataset.i); wi.decode().catch(()=>{}).then(()=>{ wt.classList.remove("swap"); wi.classList.remove("swap"); }); }, 280);
  });
  /* Cover flow de áreas comunes: arrastrar / flechas / avance automático */
  const AR = homiAreas(raw), N = AR.length, stage = $("#cfStage"), cfc = [...stage.children];
  let pos = 0, cfPlaying = !HomiFX.RM, cfDrag = false, cfMoved = false, lbOpen = false, lbI = 0;
  const wrap = o => { o = ((o % N) + N) % N; return o > N/2 ? o - N : o; };
  const layout = () => cfc.forEach((c,i) => {
    const o = wrap(i - pos), a = Math.abs(o), sg = Math.sign(o);
    const x = sg * (Math.min(a,1) * 58 + Math.max(0, Math.min(a,2.4) - 1) * 26);
    c.style.transform = `translate3d(${x}%,0,0) scale(${1 - Math.min(a,2.4) * .14})`;
    c.style.opacity = a < 1.6 ? 1 : Math.max(0, 1 - (a - 1.6) * 2.2);
    c.style.zIndex = 100 - Math.round(a * 10);
    c.style.setProperty("--dim", Math.min(a, 1).toFixed(3));
    c.classList.toggle("center", a < .5);
    c.tabIndex = a < .5 ? 0 : -1;
  });
  const cfGo = n => { pos = n; layout(); };
  const step = d => cfGo(Math.round(pos) + d);
  let cfHover = false;
  stage.addEventListener("pointerenter", e => { if(e.pointerType === "mouse") cfHover = true; });
  stage.addEventListener("pointerleave", () => { cfHover = false; });
  function cfRestart(){ clearInterval(build.cfTimer); if(!cfPlaying) return;
    build.cfTimer = setInterval(() => { const r = stage.getBoundingClientRect();
      if(!document.hidden && !lbOpen && !cfDrag && !cfHover && r.bottom > 0 && r.top < innerHeight) step(1); }, 3800); }
  let sx = 0, p0 = 0;
  stage.addEventListener("pointerdown", e => { cfDrag = true; cfMoved = false; sx = e.clientX; p0 = pos; stage.setPointerCapture(e.pointerId); });
  stage.addEventListener("pointermove", e => { if(!cfDrag) return; const dx = e.clientX - sx;
    if(Math.abs(dx) > 6 && !cfMoved){ cfMoved = true; stage.classList.add("drag"); }
    if(cfMoved){ pos = p0 - dx / (cfc[0].offsetWidth * .58); layout(); } });
  const cfEnd = () => { if(!cfDrag) return; cfDrag = false; stage.classList.remove("drag"); if(cfMoved){ cfGo(Math.round(pos)); cfRestart(); } };
  stage.addEventListener("pointerup", cfEnd); stage.addEventListener("pointercancel", cfEnd);
  cfc.forEach((c,i) => c.addEventListener("click", e => { if(cfMoved){ e.preventDefault(); cfMoved = false; return; }
    const o = Math.round(wrap(i - pos)); if(o !== 0){ cfGo(Math.round(pos) + o); cfRestart(); } else cfOpen(i); }));
  layout(); cfRestart();
  /* Vista ampliada: la foto vuela desde su tarjeta al centro con un giro */
  const cflb = $("#cfLb"), fig = $("#cfFig"), cap = $("#cfCap");
  const fillLb = i => { const a = AR[i]; $("#cfLbImg").src = a.src; $("#cfLbImg").alt = a.name; $("#cfLbName").textContent = a.name; $("#cfLbDesc").textContent = a.desc;
    $("#cfLbN").textContent = `${pad(i+1)} / ${pad(N)}`; };
  const flip = (from, to) => { const dx = (from.left + from.width/2) - (to.left + to.width/2), dy = (from.top + from.height/2) - (to.top + to.height/2);
    return `translate3d(${dx}px,${dy}px,0) scale(${from.width / to.width},${from.height / to.height})`; };
  function cfOpen(i){
    lbOpen = true; lbI = i; fillLb(i); const card = cfc[i], from = card.getBoundingClientRect();
    cflb.classList.add("show"); cflb.setAttribute("aria-hidden","false"); document.body.style.overflow = "hidden";
    const to = fig.getBoundingClientRect(); card.style.visibility = "hidden"; cap.classList.remove("in");
    fig.animate([{transform: flip(from, to) + " rotateY(0deg)", borderRadius:"20px"}, {transform:"translate3d(0,0,0) scale(1,1) rotateY(360deg)", borderRadius:"28px"}],
      {duration: HomiFX.RM ? 1 : 1100, easing: "cubic-bezier(.16,1,.3,1)"}).onfinish = () => cap.classList.add("in");
  }
  function cfClose(){
    if(!lbOpen) return; const card = cfc[lbI], to = fig.getBoundingClientRect(), dest = card.getBoundingClientRect();
    cap.classList.remove("in"); cflb.classList.add("closing");
    fig.animate([{transform:"translate3d(0,0,0) scale(1,1) rotateY(0deg)"}, {transform: flip(dest, to) + " rotateY(-360deg)", borderRadius:"20px"}],
      {duration: HomiFX.RM ? 1 : 800, easing: "cubic-bezier(.65,0,.35,1)"}).onfinish = () => {
        cflb.classList.remove("show","closing"); cflb.setAttribute("aria-hidden","true"); document.body.style.overflow = ""; card.style.visibility = ""; lbOpen = false; cfRestart(); };
  }
  function cfSwap(d){ // cambia de foto con medio giro
    const ni = ((lbI + d) % N + N) % N; cfc[lbI].style.visibility = ""; cap.classList.remove("in");
    fig.animate([{transform:"rotateY(0deg)"}, {transform:`rotateY(${d * -90}deg)`}], {duration:240, easing:"cubic-bezier(.55,0,1,.45)"}).onfinish = () => {
      lbI = ni; fillLb(ni); cfGo(Math.round(pos) + d); cfc[ni].style.visibility = "hidden";
      fig.animate([{transform:`rotateY(${d * 90}deg)`}, {transform:"rotateY(0deg)"}], {duration:420, easing:"cubic-bezier(.16,1,.3,1)"}).onfinish = () => cap.classList.add("in"); };
  }
  $("#cfX").onclick = cfClose; $("#cfLbP").onclick = () => cfSwap(-1); $("#cfLbNx").onclick = () => cfSwap(1);
  cflb.onclick = e => { if(e.target === cflb || e.target.classList.contains("cflb-in")) cfClose(); };
  build.cfKey = e => { if(lbOpen){ if(e.key==="Escape") cfClose(); if(e.key==="ArrowLeft") cfSwap(-1); if(e.key==="ArrowRight") cfSwap(1); return true; }
    if(document.activeElement && document.activeElement.closest && document.activeElement.closest("#cf")){ if(e.key==="ArrowLeft"){ step(-1); cfRestart(); } if(e.key==="ArrowRight"){ step(1); cfRestart(); } } return false; };
  document.querySelectorAll(".gtabs button").forEach(b=>b.onclick=()=>{ gcat=b.dataset.c; galOpen=false; build(); document.getElementById("galeria").scrollIntoView({block:"start"}); });
  const items = d.galeria.filter(g=>g.cat===gcat);
  const lb = $("#lb"), show = n => { lbi=(n+items.length)%items.length; $("#lbImg").src=items[lbi].src; $("#lbImg").alt=items[lbi].txt; $("#lbCap").textContent=items[lbi].txt; $("#lbCount").textContent=`${pad(lbi+1)} / ${pad(items.length)}`; };
  const open = n => { show(n); lb.classList.add("show"); lb.setAttribute("aria-hidden","false"); document.body.style.overflow="hidden"; };
  const close = () => { lb.classList.remove("show"); lb.setAttribute("aria-hidden","true"); document.body.style.overflow=""; };
  document.querySelectorAll("#ggrid figure").forEach(f=>{ f.onclick=()=>open(+f.dataset.i); f.onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); open(+f.dataset.i);} }; });
  $("#lbX").onclick=close; $("#lbP").onclick=()=>show(lbi-1); $("#lbN").onclick=()=>show(lbi+1); lb.onclick=e=>{ if(e.target===lb) close(); };
  build.key = e => { if(!lb.classList.contains("show")) return; if(e.key==="Escape") close(); if(e.key==="ArrowLeft") show(lbi-1); if(e.key==="ArrowRight") show(lbi+1); };
  homiLangUI(build);
  document.querySelectorAll("[data-lead]").forEach(b=>b.onclick=()=>homiLead.open(d.id));
  const gm = $("#galMore"); if (gm) gm.onclick = () => { galOpen = true; $("#ggrid").classList.add("open"); gm.remove(); };
  /* Esfera del desarrollador + apariciones */
  HomiFX.sphere($("#devSphere"), {n:1400, r:.46, alpha:.42, speed:.08, color:[208,255,120]});
  HomiFX.reveal(document, built);
  /* Números que cuentan al aparecer */
  const first = !built;
  const io = new IntersectionObserver(es=>es.forEach(e=>{ if(!e.isIntersecting) return; io.unobserve(e.target);
    const el=e.target, raw=el.dataset.n, n=parseFloat(raw.replace(/[^0-9.]/g,"")), pre=raw.match(/^[^0-9]*/)[0];
    if(!n || HomiFX.RM || !first) return; const t0=performance.now(), dur=1400;
    const step=now=>{ const k=Math.min(1,(now-t0)/dur), v=Math.round(n*(1-Math.pow(1-k,4))); el.textContent = pre + v.toLocaleString("en-US"); if(k<1) requestAnimationFrame(step); else el.textContent=raw; };
    requestAnimationFrame(step); }), {threshold:.6});
  document.querySelectorAll(".count-up").forEach(el=>io.observe(el));
  /* Carrusel automático de la portada */
  const hm = $(".hero-media"), himgs = [...hm.querySelectorAll("img")], hbars = [...hm.querySelectorAll(".hm-bars i")];
  let hi = 0; clearInterval(build.timer);
  const hgo = n => { hi = (n + himgs.length) % himgs.length;
    himgs.forEach((im,k)=>{ im.classList.toggle("on", k===hi); if(k===hi) im.loading="eager"; });
    hbars.forEach((b,k)=>{ b.classList.toggle("on", k===hi); b.classList.toggle("past", k<hi); });
    $("#hmCount").textContent = `${pad(hi+1)} / ${pad(himgs.length)}`;
    const cap = $("#hmCap"); cap.classList.add("swap"); setTimeout(()=>{ cap.textContent = capOf(F[hi]); cap.classList.remove("swap"); }, 250); };
  const auto = () => { clearInterval(build.timer); if(!HomiFX.RM) build.timer = setInterval(()=>{ if(!document.hidden) hgo(hi+1); }, 5000); };
  $("#hmP").onclick = () => { hgo(hi-1); auto(); }; $("#hmN").onclick = () => { hgo(hi+1); auto(); };
  auto();
  /* El parallax de la portada lo hace CSS (animation-timeline: scroll), sin listeners de scroll */
  built = true;
}
document.addEventListener('keydown', e=>{ if(build.cfKey && build.cfKey(e)) return; build.key && build.key(e); });
build();
</script>
</body>
</html>
